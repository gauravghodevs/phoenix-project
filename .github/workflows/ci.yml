name: Application CI

on:
  push:
    branches: [ "main" ]
    paths: [ "app/**" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "app/**" ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run SAST Scanner (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './app'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        run: |
          echo "Building application image with Git SHA tag..."
          # docker build -t my-app:${{ github.sha }} ./app
          echo "Image built successfully."
